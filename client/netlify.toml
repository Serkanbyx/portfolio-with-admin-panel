[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

# Proxy API requests to Render backend (same-origin cookie fix)
[[redirects]]
  from = "/api/*"
  to = "https://portfolio-with-admin-panel-833u.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
